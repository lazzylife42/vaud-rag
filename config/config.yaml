### Crawler

crawler:
  sites:
    - name: vd
      base_url: https://www.vd.ch/
      explore_keywords:
        - chomage
        - orp
        - lorp
        - laci
        - indemnite
        - indemnites
        - demandeur
        - demandeurs
        - demandeuse
        - demandeuses
        - demploi
      explore_min_hits: 3
      explore_min_ratio: 0.2
      explore_depth: 3
      include_prefixes:
        - economie/prestations-destinees-aux-demandeuses-et-demandeurs-demploi/
        - prestation/obtenir-une-indemnite-en-cas-dinsolvabilite/
      exclude_prefixes:
        - economie/prestations-destinees-aux-demandeuses-et-demandeurs-demploi/publications/
        - economie/prestations-destinees-aux-demandeuses-et-demandeurs-demploi/videos-dinformation-sur-lassurance-chomage/
        - economie/prestations-destinees-aux-demandeuses-et-demandeurs-demploi/videos-multilingues-sur-lindemnisation/
      languages: [fr]
      min_text_chars: 200
      delay_seconds: 2
